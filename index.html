<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#002970" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ApexPay - FinTech & Wallet Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      netlify-drawer,
      #netlify-drawer,
      [data-netlify-drawer],
      .netlify-drawer,
      iframe[src*="netlify"],
      div[class*="netlify-drawer"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        height: 0 !important;
      }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const killDrawer = () => {
          document.querySelectorAll('netlify-drawer, #netlify-drawer, [data-netlify-drawer], iframe[src*="netlify"]').forEach(el => el.remove());
        };
        killDrawer();
        const obs = new MutationObserver(killDrawer);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      });
    </script>
  </head>
  <body class="bg-slate-100 font-sans antialiased text-slate-800 selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
